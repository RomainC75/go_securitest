services:
  db:
    image: postgres:17.0-alpine3.20
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_NAME}
    ports:
      - '5432:5432'
    volumes: 
      - ./data:/var/lib/postgresql/data
      - ./data:/var/lib/mysql

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080

  server:
    build:
      context: .
      dockerfile: docker/local/server/Dockerfile
    command: go run main.go serve
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB_NAME=${POSTGRES_DB_NAME}
    ports:
      - '5000:5000'
    volumes:
      - ./server:/go/src/server
      - ./shared:/go/src/shared
    develop:
      watch:
        - action: sync+restart
          path: ./server
          target: /usr/src/app
    depends_on:
      - db

